name: Keep the receipt reader awake

# Supabase pauses a free-plan project after a week without enough database
# traffic, and a paused project refuses every request, so the app can only say
# "Could not reach the receipt reader". Scanning receipts does not count: the
# parse-receipt function never touches the database. This calls a tiny database
# function a few times a day so the project never looks idle.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub switches off scheduled workflows in a public repo after 60 days
      # without a commit. Enabling it again through the API resets that clock,
      # so this schedule cannot quietly lapse while the app sits unused.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"

      - uses: actions/checkout@v5
        with:
          sparse-checkout: app.json
          sparse-checkout-cone-mode: false

      # The URL and anon key come from app.json so there is one place to change them.
      - name: Ping the database
        run: |
          url=$(jq -r '.expo.extra.supabaseUrl' app.json)
          key=$(jq -r '.expo.extra.supabaseAnonKey' app.json)
          status=$(curl -sS -m 30 --retry 3 --retry-connrefused -o body.txt -w '%{http_code}' \
            -X POST "$url/rest/v1/rpc/keepalive" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP $status $(head -c 300 body.txt)"
          if [ "$status" = 540 ]; then
            echo "::error::The Supabase project is paused. Resume it from the dashboard; this workflow keeps it awake from then on."
            exit 1
          fi
          if [ "$status" != 200 ]; then
            echo "::error::Keepalive call failed with HTTP $status."
            exit 1
          fi
